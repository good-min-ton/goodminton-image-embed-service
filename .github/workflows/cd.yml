name: CD - Build & Deploy

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: goodminton-image-embed-service

jobs:
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The Dockerfile bakes the SigLIP model at build time (needs internet
      # once here). The resulting image is large (~3-4GB) but self-contained.
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull & restart container
        run: |
          cd ~/projects/goodminton
          docker compose -f docker-compose.prod.yml pull embed-service
          docker compose -f docker-compose.prod.yml up -d --no-deps embed-service
          docker image prune -f
