name: CI - Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # The test suite loads the real SigLIP model via the app lifespan.
      # Cache the Hugging Face download so only the first run pays for it.
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-siglip-base-patch16-224

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
